name: proxy-pipeline

on:
  schedule:
    - cron: "22 4 * * *"      
  workflow_dispatch:
    inputs:
      steps:
        description: "Steps (1 / 1+2 / 1+2+3)"
        default: "1+2+3"

permissions:
  contents: write

concurrency:
  group: proxy-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install "requests[socks]"

      - name: Run pipeline
        run: |
          python proxy-pipeline.py \
            --steps "${{ github.event.inputs.steps || '1+2+3' }}" \
            --time-budget 75

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs
          path: logs/
          retention-days: 7

      - name: Commit results
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ALIVE logs/summary.json
          git diff --cached --quiet || git commit -m "chore: update proxy lists [skip ci]"
          git push
