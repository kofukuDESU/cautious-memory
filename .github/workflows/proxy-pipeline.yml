name: proxy-pipeline

on:
  schedule:
    - cron: "22 4 * * *"      
  workflow_dispatch:
    inputs:
      steps:
        description: "Steps (1 / 1+2 / 1+2+3)"
        default: "1+2+3"

permissions:
  contents: write

concurrency:
  group: proxy-pipeline
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install "requests[socks]"

      - name: Run pipeline
        run: |
          python proxy-pipeline.py \
            --steps "${{ github.event.inputs.steps || '1+2+3' }}" \
            --time-budget 75

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs
          path: logs/
          retention-days: 7

      - name: Commit and push outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      
          git add -A
          if git diff --cached --quiet; then
            echo "No output changes."
            exit 0
          fi
          git commit -m "chore: refresh proxy outputs [skip ci]"
      
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase -X theirs origin/main
            if git push origin HEAD:main; then
              echo "Pushed successfully."
              exit 0
            fi
            echo "Push rejected (attempt $attempt), retrying..."
            sleep $((attempt * 3))
          done
          echo "Failed to push after 5 attempts."
          exit 1
